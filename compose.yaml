name: datapilot

services:
  agent:
    image: datapilot-backend:local
    build:
      context: .
      dockerfile: docker/local-backend.Dockerfile
    environment:
      APP_MODE: local
      SESSION_BACKEND: sqlite
      LOCAL_DATA_DIR: /app/.local
      LOCAL_SECRET_KEY_FILE: /run/secrets/settings_key
      LLM_PROVIDER: openai_compatible
      DOCKER_WSL_DISTRO: ""
      DOCKER_BIND_ROOT: ${DOCKER_BIND_ROOT:?请先运行 scripts/setup_desktop.py prepare}
      TMPDIR: /app/.local/container-tmp
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./.local:/app/.local
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - settings_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 40s

  web:
    image: datapilot-frontend:local
    build: ./frontend
    network_mode: service:agent
    depends_on:
      agent:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 15s

  database:
    image: postgres:17-bookworm
    network_mode: service:agent
    depends_on:
      agent:
        condition: service_healthy
    environment:
      POSTGRES_USER: datapilot_admin
      POSTGRES_DB: datapilot_lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-p", "55432", "-c", "shared_buffers=32MB", "-c", "max_connections=10", "-c", "work_mem=4MB", "-c", "max_parallel_workers_per_gather=0"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "55432", "-U", "datapilot_admin", "-d", "datapilot_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s

volumes:
  postgres_data:

secrets:
  settings_key:
    file: ./.local/docker-secrets/storage.key
  postgres_password:
    file: ./.local/docker-secrets/postgres-password
